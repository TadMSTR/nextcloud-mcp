[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextcloud-mcp"
version = "0.1.0"
description = "FastMCP server for Nextcloud — occ admin, OCS provisioning, WebDAV file ops"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["nextcloud", "mcp", "fastmcp", "homelab", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "influxdb-client>=1.38",
    "nats-py>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/TadMSTR/nextcloud-mcp"
Repository = "https://github.com/TadMSTR/nextcloud-mcp"
Issues = "https://github.com/TadMSTR/nextcloud-mcp/issues"

[project.scripts]
nextcloud-mcp = "nextcloud_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextcloud_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
